[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelcard-builder"
version = "0.1.0"
description = "Generate a friendly, readable model card (markdown) from local LLM files: GGUF, Ollama, and LM Studio."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["llm", "gguf", "ollama", "lm-studio", "model-card", "local-ai"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
modelcard = "modelcard_builder.cli:main"

[tool.setuptools.packages.find]
include = ["modelcard_builder*"]
